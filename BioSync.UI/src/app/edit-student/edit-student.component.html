
<div class="flex justify-center items-center">
    <mat-toolbar class="toolbar-container">
        <span class="text-custom-32 text-brightRed">Edit Student's Data</span>
    </mat-toolbar>
</div>
<div class="flex justify-center items-center">
    <form class="mt-8 flex justify-between w-[90%] bg-transparent" [formGroup]="editStudentForm">
        <div class="w-[45%] flex flex-col gap-4">
            <div class="group flex flex-col gap-1">
                <label for="student-number" class="text-custom-20
                    text-darkGray transition-colors duration-300
                    group-focus-within:text-brightRed">
                    Student Number
                </label>
                <input matInput id="student-number" name="student-number"
                    placeholder="Enter Student number" class="bg-transparent
                    border-b-2 border-darkGray focus:border-brightRed
                    focus:outline-none transition-colors
                    duration-300 w-full py-2 px-1"
                    formControlName="student_name">
            </div>
            <div class="group flex flex-col gap-1">
                <label for="first-name" class="text-custom-20
                    text-darkGray transition-colors duration-300
                    group-focus-within:text-brightRed">
                    First Name
                </label>
                <input matInput id="first_name" name="first-name"
                    placeholder="Enter student's first name" class="bg-transparent
                    border-b-2 border-darkGray focus:border-brightRed
                    focus:outline-none transition-colors
                    duration-300 w-full py-2 px-1" formControlName="first_name">
            </div>
            <div class="group flex flex-col gap-1">
                <label for="last-name" class="text-custom-20
                    text-darkGray transition-colors duration-300
                    group-focus-within:text-brightRed">
                    Last Name
                </label>
                <input matInput id="last_name" name="last-name"
                    placeholder="Enter student's last name" class="bg-transparent
                    border-b-2 border-darkGray focus:border-brightRed
                    focus:outline-none transition-colors
                    duration-300 w-full py-2 px-1" formControlName="last_name">
            </div>
            <div class="group flex flex-col gap-1">
                <label for="middle-initial" class="text-custom-20
                    text-darkGray transition-colors duration-300
                    group-focus-within:text-brightRed">
                    Middle Initial
                </label>
                <input matInput id="middle_initial" name="middle-initial"
                    placeholder="Enter student's first name" class="bg-transparent
                    border-b-2 border-darkGray focus:border-brightRed
                    focus:outline-none transition-colors
                    duration-300 w-full py-2 px-1" formControlName="middle_initial">
            </div>
            <div class="group flex flex-col gap-1">
                <label for="suffix" class="text-custom-20
                    text-darkGray transition-colors duration-300
                    group-focus-within:text-brightRed">
                    Suffix
                </label>
                <mat-select id="suffix" name="suffix"
                            placeholder="Choose a student's suffix" class="bg-transparent
                            border-b-2 border-darkGray focus:border-brightRed
                            focus:outline-none transition-colors
                            duration-300 w-full py-2 px-1" formControlName="suffix">
                            @for(suffix of allSuffix; track suffix) {
                                <mat-option [value]="suffix">{{suffix}}</mat-option>
                            }
                </mat-select>
            </div>
            <div class="group flex flex-col gap-1">
                <label for="program" class="text-custom-20
                    text-darkGray transition-colors duration-300
                    group-focus-within:text-brightRed">
                    Program
                </label>
                <mat-select id="program" name="program"
                            placeholder="Choose a student's program" class="bg-transparent
                            border-b-2 border-darkGray focus:border-brightRed
                            focus:outline-none transition-colors
                            duration-300 w-full py-2 px-1" formControlName="program">
                            @for(program of allPrograms; track program) {
                                <mat-option [value]="program">{{program}}</mat-option>
                            }
                </mat-select>
            </div>
            <div class="flex justify-between">
                <div class="group flex flex-col gap-1 w-[47%]">
                    <label for="Year" class="text-custom-16
                        text-darkGray transition-colors duration-300
                        group-focus-within:text-brightRed">
                        Year
                    </label>
                    <mat-select id="year" name="year"
                            placeholder="Choose a student's year" class="bg-transparent
                            border-b-2 border-darkGray focus:border-brightRed
                            focus:outline-none transition-colors
                            duration-300 w-full py-2 px-1" formControlName="year">
                            @for(year of allYears; track year) {
                                <mat-option [value]="year">{{year}}</mat-option>
                            }
                </mat-select>
                </div>
                <div class="group flex flex-col gap-1 w-[47%]">
                    <label for="section" class="text-custom-16
                        text-darkGray transition-colors duration-300
                        group-focus-within:text-brightRed">
                        Section
                    </label>
                    <mat-select id="section" name="section"
                            placeholder="Choose a student's section" class="bg-transparent
                            border-b-2 border-darkGray focus:border-brightRed
                            focus:outline-none transition-colors
                            duration-300 w-full py-2 px-1" formControlName="program">
                            @for(section of allSections; track section) {
                                <mat-option [value]="section">{{section}}</mat-option>
                            }
                </mat-select>
                </div>
            </div>
            <div class="flex flex-col justify-end gap-4 mt-10">
                <div class="flex gap-[40px] justify-end">
                    <button class="text-custom-14 text-lightGray py-2
                        px-20 border-2 rounded-full border-lightGray
                        hover:bg-lightGray hover:text-white"
                        (click)="cancelEditStudent()">
                        Cancel
                    </button>
                    <button class="text-custom-14 text-white py-2 px-19
                        bg-gradient-red-orange rounded-full
                        hover:bg-gradient-dark-red-orange hover:text-f4White"
                        (click)="submit()">
                        Save
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>
