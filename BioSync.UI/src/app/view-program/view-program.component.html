<div class="flex justify-center items-center">
    <mat-toolbar class="toolbar-container">
        <span class="text-custom-32 text-brightRed">View Program</span>
    </mat-toolbar>
</div>
<div class="flex justify-center items-center">
    <div class="mt-2 flex justify-between w-[94%]
            bg-white py-4 px-4 rounded-2xl ">
        <div class="flex gap-5">
            <div class="flex flex-col gap-4">
                <p class="text-brightRed text-custom-16 font-medium">
                    Program Name:
                </p>
                <p class="text-brightRed text-custom-16 font-medium">
                    Program Abbreviation:
                </p>
                <p class="text-brightRed text-custom-16 font-medium">
                    Description:
                </p>
            </div>
            <div class="flex flex-col gap-4">
                <p class="text-darkGray text-custom-16">
                    {{ program.programName }}
                </p>
                <p class="text-darkGray text-custom-16">
                    {{ program.programAbbreviation }}
                </p>
                <p class="text-darkGray text-custom-16">
                    {{ program.programDescription }}
                </p>
            </div>
        </div>
    </div>
</div>
<div class="flex justify-center items-center">
    <div class="mt-28 flex justify-end w-[94%]">
        <button class="text-custom-14 text-white py-2 px-19
            bg-gradient-red-orange rounded-full
            hover:bg-gradient-dark-red-orange hover:text-f4White"
            (click)="returnToProgramView()">
            Back
        </button>
    </div>
</div>
