<div id="grid">
  <div id="div1">
    <video id="videoElement" autoplay></video>
  </div>
  <div id="div2" class="flex flex-col justify-center items-center gap-24">
    @if(recognized && !loading){
      <p class="text-2xl">{{ message }}</p>
      <div class="w-60 h-60 bg-gray-600">
      </div>
      <div class="text-center">
        <p class="text-2xl">{{ name }}</p>
        <p class="text-2xl">{{ student_code }}</p>
      </div>
    } @else if(!recognized && submitted && loading){
      <mat-spinner></mat-spinner>
    }
    @else if(!recognized && submitted && !loading){
      <p class="text-2xl">USER NOT RECOGNIZED</p>
    } @else {
      <p>Scan Now</p>
    }
  </div>
  <div id="div3">
    <div class="flex flex-col justify-center items-center h-full gap-4">
      <h2>{{ schedule.subject }}</h2>
      <p>{{schedule.scheduleDate}}</p>
      <p>{{ schedule.professor }}</p>
    </div>
  </div>
</div>
