<div class="header">
    <mat-toolbar class="toolbar-container">
        <span>List of Schedules - ALL</span>
        <div class="toolbar-button">
            <button>List of Schedules</button>
            <button>Add New Section</button>
        </div>
    </mat-toolbar>
</div>
<div class="filter-container">
    <mat-toolbar class="filter-content">
        <div class="search-container">
            <mat-icon class="search-icon">search</mat-icon>
            <input type="text" placeholder="SEARCH">
        </div>
        <div class="dropdown-container">
            <div class="dropdown-content">
                <div class="entry-container">
                    <span>Show</span>
                    <select [(ngModel)]="itemsPerPage" (change)="onItemsPerPageChange()">
                      <option *ngFor="let entry of entries" [value]="entry" [selected]="entry === '10'">{{entry}}</option>
                    </select>
                    <span>Entries</span>
                </div>
                <div class="sort-container">
                    <select>
                        <option>Sort by</option>
                        <option *ngFor="let sort of sorting" [value]="sort">{{sort}}</option>
                    </select>
                </div>
            </div>
        </div>
    </mat-toolbar>
</div>
<div class="table-container">
    <div class="subject-table">
        <div class="attributes">
            <div class="cell">Subject Code</div>
            <div class="cell">Subject Name</div>
            <div class="cell">Action</div>
        </div>
        <div class="row-container">
            @for (subject of filteredSubjects; track subject) {
                <div class="row">
                    <div class="cell">{{ subject.subject_code }}</div>
                <div class="cell">{{ subject.subject_name }}</div>
                <div class="cell">
                    <button (click)="createSchedule(subject)">Create Schedule</button>
                  </div>
                </div>
            }
        </div>
    </div>
</div>
<div class="line-container">
    <img src="../../assets/black-line.svg">
</div>
<div class="bottom-container">
    <div class="paginator">
        <div class="paginator-info">
          {{ getDisplayRange() }} of {{ totalItems }}
        </div>
        <div class="paginator-controls">
          <span>Page</span>
          <select [(ngModel)]="currentPage" (change)="onPageChange()">
            @for (page of pages; track page) {
                <option [value]="page">{{ page }}</option>
            }
          </select>
          <div class="paginator-button-container">
            <button (click)="previousPage()" 
                    [disabled]="currentPage === 1"
                    [ngClass]="{'active-button': currentPage > 1}">
                <img src="../../assets/previous.svg" 
                        alt="Previous Icon" 
                        [ngClass]="{'active-icon': currentPage > 1}">
                Previous
            </button>
            <button (click)="nextPage()" 
                    [disabled]="currentPage === totalPages"
                    [ngClass]="{'active-button': currentPage < totalPages}">
                Next
                <img src="../../assets/next.svg" 
                        alt="Next Icon" 
                        [ngClass]="{'active-icon': currentPage < totalPages}">
            </button>
          </div>
        </div>
    </div>
</div>
