<div class="main-container main-container flex flex-col justify-between md:flex-row h-full w-full">
    <div class="left-section w-full md:w-[50%] flex-1 flex-end justify-end items-center">
        <img class="w-full h-[45vh] md:h-screen object-cover object-center" src="../../assets/visitor-bg.png" alt="DOST Laboratory">
        <div class="absolute bottom-0 left-0 flex justify-start items-end w-full p-4">
            <div class="flex justify-center items-center ml-2 mb-2 gap-4">
                <img class="w-12 h-12" src="../../assets/PUP-logo.png" alt="PUP logo">
                <div class="border-l-4 border-white h-12"></div>
                <div class="flex flex-col text-white">
                    <p class="text-custom-24 font-medium">BioSync</p>
                    <p class="text-custom-14 font-weight400">Polytechnic University of the Philippines - Taguig Branch</p>
                </div>
            </div>
        </div>
    </div>
    <div class="right-section flex flex-1 flex-col items-center w-full md:w-[50%] mt-5 md:mt-12">
      <form class="mt-8 flex justify-center w-[90%] bg-transparent" (ngSubmit)="submit()" [formGroup]="visitorLogForm">
        <div class="w-[80%] md:w-[70%] flex flex-col gap-4">
                <div class="text-container">
                    <h2 class="text-custom-20 md:text-custom-40 text-darkGrey font-semibold mb-0 md:mb-4">Visitor's Log</h2>
                    <p class="text-custom-12 md:text-custom-16 text-lightGray mb-0 md:mb-6">Welcome, Visitor! Please fill up the form below.</p>
                </div>
                <div class="group flex flex-col gap-1">
                    <label for="visitor-name" class="text-custom-16 md:text-custom-20
                        text-darkGray transition-colors duration-300
                        group-focus-within:text-brightRed">
                        Visitor's Name
                    </label>
                    <input matInput id="visitor_name" name="visitor-name"
                        placeholder="Enter Visitor's Name" class="bg-transparent
                        border-b-2 border-darkGray focus:border-brightRed
                        focus:outline-none transition-colors
                        duration-300 w-full py-2 md:py-2 px-1"
                        formControlName="name">
                </div>
                <div class="group flex flex-col gap-1">
                    <label for="visit-purpose" class="text-custom-20
                        text-darkGray transition-colors duration-300
                        group-focus-within:text-brightRed">
                        Purpose of Visit
                    </label>
                    <mat-select id="visit_purpose" name="visit-purpose" placeholder="Select your Purpose of Visit"
                            class="bg-transparent border-b-2 border-darkGray focus:border-brightRed
                            focus:outline-none transition-colors 
                            duration-300 w-full py-2 px-1" formControlName="purposeOfVisit"
                            (selectionChange)="onVisitPurposeChange($event)">
                            @for(visitPurpose of visitPurposes; track visitPurpose) {
                                <mat-option [value]="visitPurpose">{{visitPurpose}}</mat-option>
                            }
                            <mat-option value="Others">Others</mat-option>
                    </mat-select>
                </div>
                @if(showOtherDetails) {
                    <div class="group flex flex-col gap-1">
                        <label for="other-details" class="text-custom-16 md:text-custom-20
                            text-darkGray transition-colors duration-300
                            group-focus-within:text-brightRed">
                            Other Details
                        </label>
                        <input matInput id="other_details" name="other-details"
                            placeholder="Any additional details for visit" class="bg-transparent
                            border-b-2 border-darkGray focus:border-brightRed
                            focus:outline-none transition-colors
                            duration-300 w-full py-2 md:py-2 px-1"
                            formControlName="otherDetails">
                    </div>
                }
                <div class="group flex flex-col gap-1">
                    <label for="destination" class="text-custom-16 md:text-custom-20
                        text-darkGray transition-colors duration-300
                        group-focus-within:text-brightRed">
                        Destination
                    </label>
                    <mat-select id="destination" name="destination"
                            placeholder="Select your Destination" class="bg-transparent
                            border-b-2 border-darkGray focus:border-brightRed
                            focus:outline-none transition-colors
                            duration-300 w-full py-2 md:py-2 px-1" formControlName="destination">
                            @for(lab of labs; track lab) {
                                <mat-option [value]="lab">{{lab}}</mat-option>
                            }
                    </mat-select>
                </div>
                <div class="flex gap-4 justify-center mt-6">
                    <button class="text-custom-14 text-lightGray py-2 px-10 md:px-20 border-2 rounded-full border-lightGray
                        hover:bg-lightGray hover:text-white" (click)="navigateTo('login')">
                        Cancel
                    </button>
                    <button class="text-custom-14 text-white py-2 px-10 md:px-20 bg-gradient-red rounded-full
                        hover:bg-gradient-dark-red hover:text-f4White">
                        Submit
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
